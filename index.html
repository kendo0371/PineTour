<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PineTour</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-linear-to-t from-blue-200 to-white min-h-screen">
    <div class="bg-sky-50">
      <!-- hero -->
      <header
        class="bg-[url('images/hero.png')] relative bg-cover bg-center h-[60vh] flex items-center justify-center">
        <div
          class="absolute inset-0 bg-linear-to-t from-white/70 to-transparent"></div>
        <div
          class="absolute flex justify-evenly w-full top-0 left-0 items-center md:px-10 md:py-6">
          <img class="h-8 md:h-10 cursor-pointer" src="images/PiCo-logo.png" />

          <div class="flex gap-3 text-sm p-4 text-white md:gap-18 md:text-xl">
            <a class="cursor-pointer" href="home">Home</a>
            <a class="cursor-pointer" href="about">About</a>
            <a class="cursor-pointer" href="contact">Contact</a>
            <a class="cursor-pointer" href="user">👤</a>
          </div>

          <button class="cursor-pointer bg-white px-3 py-3 rounded-full">
            EN
          </button>
        </div>
        <div
          class="relative items-center text-center flex flex-col gap-4 font-extrabold">
          <h2 class="text-3xl md:text-5xl text-gray-500">PURE MAGIC</h2>
          <h1 class="text-6xl md:text-9xl text-white">AWAITS!</h1>
          <h3 class="text-3xl md:text-5xl text-gray-500">2024</h3>
        </div>
      </header>

      <!-- Location -->
      <section
        class="flex flex-wrap justify-center md:justify-evenly items-center gap-5 py-15 px-5">
        <div
          class="relative w-65 h-95 rounded-2xl overflow-hidden bg-[url('images/Terhiin-tsagaan-nuur.png')] bg-cover bg-center">
          <div
            class="absolute inset-0 flex items-center font-bold uppercase text-center transition hover:bg-black/40 cursor-pointer">
            <p class="text-white text-2xl font-bold uppercase text-center">
              TERKHIIN TSAGAAN LAKE
            </p>
          </div>
        </div>
        <div
          class="relative w-65 h-95 rounded-2xl overflow-hidden bg-[url('images/Amarbaysgalant-hiid.png')] bg-cover bg-center">
          <div
            class="absolute inset-0 flex items-center font-bold uppercase text-center transition hover:bg-black/40 cursor-pointer">
            <p class="text-white text-2xl font-bold uppercase text-center">
              AMARBAYASGALANT MONASTERY
            </p>
          </div>
        </div>
        <div
          class="relative w-65 h-95 rounded-2xl overflow-hidden bg-[url('images/Howsgol-nuur.png')] bg-cover bg-center">
          <div
            class="absolute inset-0 flex items-center font-bold uppercase text-center transition hover:bg-black/40 cursor-pointer">
            <p class="text-white text-2xl font-bold uppercase text-center">
              KHUVSGUL LAKE
            </p>
          </div>
        </div>
        <div
          class="relative w-65 h-95 rounded-2xl overflow-hidden bg-[url('images/Horgiin-togoo.png')] bg-cover bg-center">
          <div
            class="absolute inset-0 flex items-center font-bold uppercase text-center transition hover:bg-black/40 cursor-pointer">
            <p class="text-white text-2xl font-bold uppercase text-center">
              KHORGIIN TOGOO
            </p>
          </div>
        </div>
      </section>
      <!-- Roadmap -->
      <div>asdasdsad</div>

      <!-- Footer -->
      <footer></footer>
    </div>
  </body>
</html>
