    <script>
      const language = document.querySelector("#language");
      const texts = document.querySelectorAll("[data-mn]");
      let lang = "en";

      language.addEventListener("click", function () {
        if (lang === "en") {
          lang = "mn";
        } else {
          lang = "en";
        }

        for (let i = 0; i < texts.length; i++) {
          if (lang === "mn") {
            texts[i].textContent = texts[i].dataset.mn;
          } else {
            texts[i].textContent = texts[i].dataset.en;
          }
        }

        if (lang === "en") {
          language.textContent = "MN";
        } else {
          language.textContent = "EN";
        }
      });

      for (let i = 0; i < texts.length; i++) {
        texts[i].textContent = texts[i].dataset.en;
      }
    </script>
